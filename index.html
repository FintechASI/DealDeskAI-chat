<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DealDesk AI — Chat</title>
    <meta name="description" content="DealDesk AI — Commercial and Residential Mortgage Underwriting Intelligence and Automated Debt Advisory Chat." />
    <meta property="og:title" content="DealDesk AI — Chat" />
    <meta property="og:description" content="Universal commercial & residential mortgage underwriting advisor and real-time debt sizing desk." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="./assets/dealdesk-chat-person-circle.png" />
    <link rel="apple-touch-icon" href="./assets/dealdesk-chat-person-circle.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #090d16;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      #loancity-ai-widget {
        width: 100%;
        height: 100%;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <!-- DealDesk AI — Universal Mortgage Website Drop-In Script -->
    <div id="loancity-ai-widget" data-title="DealDesk AI" data-division="auto"></div>
    <script
      async
      src="https://DealDeskAI.com/widget.js"
      data-endpoint="https://DealDeskAI.com"
      data-title="DealDesk AI"
      data-division="auto"
      onerror="if(!window.DealDeskAIWidget){var s=document.createElement('script');s.src='./widget.js';document.head.appendChild(s);}"
    ></script>

    <!-- Reliable local fallback loader: activates ./widget.js seamlessly if remote script is unreachable -->
    <script>
      (function() {
        var fallbackLoaded = false;
        function loadFallback() {
          if (fallbackLoaded || window.DealDeskAIWidget) return;
          fallbackLoaded = true;
          var s = document.createElement('script');
          s.src = './widget.js';
          document.head.appendChild(s);
        }
        window.addEventListener('error', function(e) {
          if (e.target && e.target.src && e.target.src.indexOf('widget.js') !== -1) {
            loadFallback();
          }
        }, true);
        setTimeout(function() {
          if (!window.DealDeskAIWidget) {
            loadFallback();
          }
        }, 1200);
      })();
    </script>
  </body>
</html>
