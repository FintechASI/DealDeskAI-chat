<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DealDesk AI — Commercial & Residential Loan Intelligence</title>
    <meta name="description" content="DealDesk AI — Embedded Mortgage Chat & Document Analyzer." />
    <link rel="icon" type="image/png" href="./assets/dealdesk-chat-person-circle.png" />
    <link rel="apple-touch-icon" href="./assets/dealdesk-chat-person-circle.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        color: #1b1c20;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      .chat-wrapper {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #ffffff;
      }
      iframe.dealdesk-frame {
        width: 100%;
        height: 100%;
        border: none;
        background: #ffffff;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div class="chat-wrapper">
      <!-- DealDesk AI — Embedded Mortgage Chat & Document Analyzer -->
      <iframe
        id="dealdesk-frame"
        class="dealdesk-frame"
        src="https://DealDeskAI.com/?embed=true&title=DealDesk%20AI&division=auto"
        title="DealDesk AI — Commercial & Residential Loan Intelligence"
        width="100%"
        height="100%"
        style="border: none; background: #ffffff;"
        allow="camera; clipboard-write"
      ></iframe>
    </div>

    <!-- DealDesk AI — Universal Mortgage Website Drop-In Script -->
    <div id="loancity-ai-widget" data-title="DealDesk AI" data-division="auto" style="display:none;"></div>
    <script
      async
      src="https://DealDeskAI.com/widget.js"
      data-endpoint="https://DealDeskAI.com"
      data-title="DealDesk AI"
      data-division="auto"
    ></script>

    <script>
      (function() {
        var frame = document.getElementById('dealdesk-frame');
        if (!frame) return;

        // When running on localhost or in development, route to local DealDeskAI-studio engine (port 3020)
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (isLocal) {
          frame.src = 'http://localhost:3020/?embed=true&title=DealDesk%20AI&division=auto';
        }

        // Error detection: if iframe fails to load (e.g. DNS or offline), fallback gracefully
        frame.addEventListener('error', function() {
          if (isLocal && frame.src.indexOf('3020') === -1) {
            frame.src = 'http://localhost:3020/?embed=true&title=DealDesk%20AI&division=auto';
          }
        });
      })();
    </script>
  </body>
</html>
